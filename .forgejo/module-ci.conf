UPSTREAM_URL=https://github.com/maxsteeel/nomount.git
UPSTREAM_BRANCH=dev
ZIP_PREFIX=NoMount
VERSION_CODE_FLOOR=750
CHANGELOG_PATH=CHANGELOG.md
# upstream .github/workflows/build.yml (dev branch flavour). The .ko files are built by the
# workflow's ddk steps (.forgejo/nomount-lkm.sh) from the same merged tree into ../lkm.
build() {
    [ "$(git rev-parse HEAD:kernel/src)" = "$(cat ../lkm/tree)" ] || { echo "kernel modules were built from another kernel/src" >&2; return 1; }
    [ "$(ls ../lkm/*.ko | wc -l)" -eq 16 ] || { echo "expected 16 kernel modules in ../lkm" >&2; return 1; }
    T="$HOME/tools"; mkdir -p "$T"
    zurl=$(curl -fsSL https://ziglang.org/download/index.json | python3 -I -c 'import json,sys;print(json.load(sys.stdin)["master"]["x86_64-linux"]["tarball"])')
    curl -fsSL "$zurl" | tar -xJ -C "$T" && export PATH="$(echo "$T"/zig-*):$PATH"
    zig version >&2
    (cd "$T" && curl -fsSL https://distfiles.gentoo.org/distfiles/1e/ELFkickers-3.2.tar.gz | tar -xz && make -s -C ELFkickers-3.2 sstrip >&2)
    SSTRIP="$T/ELFkickers-3.2/sstrip/sstrip"
    mkdir -p bin module/bin
    (cd userspace/src
     zig cc -target aarch64-linux -Oz -Xclang -Oz -mcmodel=tiny -static -ffreestanding -flto -fno-ident -fno-unwind-tables \
       -fno-asynchronous-unwind-tables -Wl,--gc-sections,-z,norelro -mllvm -enable-machine-outliner=always nm.c -o ../../bin/nm-arm64
     zig cc -target arm-linux -Oz -Xclang -Oz -static -ffreestanding -flto -ffunction-sections -fdata-sections \
       -fno-unwind-tables -fno-asynchronous-unwind-tables -fno-ident -Wl,--gc-sections,-z,norelro nm.c -o ../../bin/nm-arm
     zig cc -target x86_64-linux -Oz -Xclang -Oz -static -ffreestanding -flto -ffunction-sections -fdata-sections \
       -fno-unwind-tables -fno-asynchronous-unwind-tables -fno-ident -Wl,--gc-sections,-z,norelro nm.c -o ../../bin/nm-x86_64) >&2
    "$SSTRIP" -z bin/nm-*
    mv bin/nm-* module/bin/
    git clone -q https://github.com/maxsteeel/lkmloader.git "$T/lkmloader"
    (cd "$T/lkmloader" && make TARGET=aarch64 && make TARGET=arm && make TARGET=x86_64) >&2
    "$SSTRIP" -z "$T"/lkmloader/lkmloader-*
    mv "$T"/lkmloader/lkmloader-* module/bin/
    COMMIT_COUNT=$(git rev-list --count HEAD); SHORT_HASH=$(git rev-parse --short HEAD)
    sed -i "s/^versionCode=.*/versionCode=${COMMIT_COUNT}/" module/module.prop
    sed -i "s/^version=\(.*\)/version=\1 \(${COMMIT_COUNT}-${SHORT_HASH}-dev\)/" module/module.prop
    M="$HOME/module-build"; W="$HOME/webui-build"
    rm -rf "$M" "$W"; cp -a module "$M"; mkdir -p "$W"
    for f in "$M"/webroot/locales/*.json; do jq -c . "$f" > "$f.tmp" && mv "$f.tmp" "$f"; done
    curl -fsSL https://registry.npmjs.org/@esbuild/linux-x64/-/linux-x64-0.28.1.tgz | tar -xz -C "$T" --strip-components=2 package/bin/esbuild
    "$T/esbuild" module/webroot/index.js --bundle --format=esm --minify --charset=utf8 --outfile="$W/index.js" >&2
    "$T/esbuild" module/webroot/styles.css --minify --outfile="$W/styles.css" >&2
    tr '\n' ' ' < module/webroot/index.html | sed 's/  */ /g' | sed 's/> </></g' > "$W/index.html"
    install -m 0644 "$W/index.js" "$W/styles.css" "$W/index.html" "$M/webroot/"
    mkdir -p "$M/lkm"; cp ../lkm/*.ko "$M/lkm/"
    (cd "$M" && zip -qr9 "$OUT/module.zip" .)
}
